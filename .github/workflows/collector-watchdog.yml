name: Collector watchdog

on:
  schedule:
    - cron: "23 16 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a recent successful production collector run
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'document-collector.yml', branch: context.payload.repository.default_branch,
              status: 'success', per_page: 1
            });
            const run = data.workflow_runs[0];
            const age = run ? Date.now() - Date.parse(run.run_started_at) : Infinity;
            if (!Number.isFinite(age) || age > 48 * 60 * 60 * 1000) {
              core.setFailed('COLLECTOR_STALE: no successful production collector run in 48 hours. Check the schedule, configuration, and latest failure.');
            }
            await core.summary.addHeading('Collector freshness').addRaw(
              run ? `Last successful run: ${run.html_url}\nStarted: ${run.run_started_at}` : 'No successful production collector run found.'
            ).write();
