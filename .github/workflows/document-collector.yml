name: Official document collector

on:
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-document-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @points-race/document-collector test
      - run: pnpm --filter @points-race/document-collector build
      - name: Collect and submit approved official documents
        run: node apps/document-collector/dist/run.js
        env:
          POINTS_RACE_SERVICE_URL: ${{ secrets.POINTS_RACE_SERVICE_URL }}
          DOCUMENT_INGEST_SECRET: ${{ secrets.DOCUMENT_INGEST_SECRET }}
